# Copy to .github/workflows/panel-bundle.yml in the consuming repository.
name: Panel Bundle

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'custom_components/*/panel/**'
      - '.github/workflows/panel-bundle.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'custom_components/*/panel/**'
      - '.github/workflows/panel-bundle.yml'

permissions:
  contents: read

jobs:
  panel:
    uses: PineappleEmperor/ha-panel-ci/.github/workflows/panel-bundle.yml@e25057c83ff60ec60db161827974cb95bf41cc63 # v1.0.0rc1
